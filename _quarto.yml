project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "blog/*.qmd"
    - "blog/posts/**/*.qmd"

website:
  title: "Ye Yixiang's Blog"
  description: "四川大学计算机科学与技术学生 · 知识图谱、GraphRAG 与功能游戏"
  site-url: "https://yeyixiang07.github.io"
  repo-url: "https://github.com/yeyixiang07/yeyixiang07.github.io"
  repo-branch: main
  repo-actions: [edit, issue]
  favicon: assets/favicon.svg
  navbar:
    left:
      - href: index.qmd
        text: 首页
      - href: blog/index.qmd
        text: 博客
      - href: projects.qmd
        text: 项目
      - href: about.qmd
        text: 关于
    right:
      - icon: github
        href: https://github.com/yeyixiang07
        aria-label: GitHub
  search:
    location: navbar
    type: overlay
  open-graph: true
  twitter-card: true
  page-footer:
    left: "© 2026 Ye Yixiang"
    center: "四川大学 · 计算机科学与技术"
    right: "Built with [Quarto](https://quarto.org)"

format:
  html:
    theme:
      light: [cosmo, _styles/zh.scss]
      dark: [darkly, _styles/zh.scss]
    toc: true
    toc-depth: 3
    code-copy: true
    code-overflow: wrap
    fig-align: center
    max-width: 820px
    respect-user-color-scheme: true

lang: zh

crossref:
  eq-prefix: "式"
  fig-prefix: "图"
  tbl-prefix: "表"
  sec-prefix: "节"
